name: Seed Firestore demo identity

# Authorized execute only. PRs never call this workflow's --execute path;
# pr-checks runs dry-run instead. Requires Environment ci-cd-factored + WIF.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Actor source: fixture (synthetic) or bigquery (HMAC cohort)"
        type: choice
        options:
          - fixture
          - bigquery
        default: fixture
      confirm_execute:
        description: "Type execute to write Firestore (required)"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

jobs:
  seed:
    name: seed-execute
    runs-on: ubuntu-latest
    environment: ci-cd-factored
    if: >-
      ${{ vars.GCP_PROJECT_ID != '' && vars.WIF_PROVIDER != '' &&
      vars.WIF_SERVICE_ACCOUNT != '' &&
      github.event.inputs.confirm_execute == 'execute' }}
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - name: Install
        run: bun install --frozen-lockfile
      - name: Execute seed
        env:
          GOOGLE_CLOUD_PROJECT: ${{ env.GCP_PROJECT_ID }}
          BIGQUERY_DATASET: ${{ vars.BIGQUERY_DATASET || 'hackathon' }}
          DEMO_ACTOR_HMAC_KEY: ${{ secrets.DEMO_ACTOR_HMAC_KEY }}
        run: |
          set -euo pipefail
          SOURCE_FLAG="--fixture"
          if [[ "${{ github.event.inputs.source }}" == "bigquery" ]]; then
            SOURCE_FLAG="--from-bigquery"
            if [[ -z "${DEMO_ACTOR_HMAC_KEY:-}" ]]; then
              echo "DEMO_ACTOR_HMAC_KEY secret required for --from-bigquery" >&2
              exit 1
            fi
          fi
          bun run seed:firestore-demo-identity -- --execute "$SOURCE_FLAG"

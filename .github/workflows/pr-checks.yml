name: PR checks

on:
  pull_request:
    paths:
      - "app/backend/**"
      - "data-ingestion-and-processing/**"
      - "deploy/terraform/**"
      - "firestore.indexes.json"
      - ".github/workflows/pr-checks.yml"
      - ".github/workflows/seed-firestore-demo-identity.yml"

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      (contains(github.event.pull_request.labels.*.name, 'skip-ci') == false)
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Spec check
        run: bun run spec:check
      - name: Types
        run: bun run check-types
      - name: Lint
        run: bun run check
      - name: Test
        env:
          SESSION_STORE_ENABLED: "false"
          LLM_CACHE_ENABLED: "false"
        run: bun test
      - name: Seed Firestore demo identity (dry-run)
        run: bun run seed:firestore-demo-identity -- --dry-run --fixture

  pipeline:
    name: pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-ingestion-and-processing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Pytest
        run: pytest -q

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform/environments/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"
      - name: fmt
        run: terraform fmt -check -recursive ../..
      - name: init (no backend)
        run: terraform init -backend=false -input=false
      - name: validate
        run: terraform validate
